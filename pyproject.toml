[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analysis"
version = "0.1.0"
description = "Download and analyse a chess.com player's games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-analysis = "chess_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
